name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]     # main is checked by cd.yml, which calls this file first
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check (no dependencies needed)
        run: python -m compileall -q app ui evals verification

      - name: Lint for real errors only
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 app ui evals verification

      - name: Shell scripts parse
        run: for f in deploy/*.sh; do bash -n "$f"; done

      - name: UI image builds
        run: docker build -t rag-ui-ci ui
