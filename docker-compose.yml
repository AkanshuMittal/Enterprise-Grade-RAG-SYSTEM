# LOCAL DEVELOPMENT ONLY. Cloud Run does not use this file.
# Run from the project root:  docker compose up --build
#   UI  -> http://localhost:8501
#   API -> http://localhost:8000/health
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      - "8000:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ui:
    build: ./ui
    environment:
      PORT: "8501"
      BACKEND_URL: http://api:8080      # service name, not localhost
      RAG_API_KEY: ${RAG_API_KEY}       # read from .env by compose
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    # Optional: edit the UI without rebuilding (uncomment)
    # volumes:
    #   - ./ui/app.py:/app/app.py:ro